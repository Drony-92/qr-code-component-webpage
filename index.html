<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
    <link rel="shortcut icon" href="qr-code-component-webpage/images
/qr-code-icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>QR Code Component</title>
</head>

<body>
    <main class="main-container">
        <div class="qr-container">
            <img id="qr-image" src="qr-code-component-webpage/images/qr-code-image.png" alt="QR code linking to Frontend Mentor">
        </div>

        <div class="description-container">
            <h1 class="main-title">Improve your front-end skills by building projects</h1>
            <p id="main-description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next
                level
            </p>
        </div>
    </main>
</body>

</html>
